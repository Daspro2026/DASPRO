<script>
document.querySelectorAll(".lp-seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".lp-seg button").forEach(x=>x.setAttribute("aria-selected",x===b));["p1","p2"].forEach(id=>document.getElementById(id).classList.toggle("hide",id!==b.dataset.t))});
let ev=null;const bp=document.getElementById("btnPasang");
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ev=e;bp.classList.remove("hide")});
bp.onclick=async()=>{if(!ev)return;ev.prompt();await ev.userChoice.catch(()=>{});ev=null;bp.classList.add("hide")};
addEventListener("appinstalled",()=>bp.classList.add("hide"));
</script>
<script type="module">
import {auth,db,onAuthStateChanged,doc,getDoc} from "./js/firebase.js";
try{onAuthStateChanged(auth,async u=>{if(!u)return;let r="";try{r=(await getDoc(doc(db,"users",u.uid))).data()?.role}catch{}
const m=document.getElementById("btnMasuk"),d=document.getElementById("btnDaftar");m.classList.add("hide");d.href=r==="admin"?"admin.html":"dashboard.html";d.textContent="Buka dashboard"})}catch{}
</script></body></html>
