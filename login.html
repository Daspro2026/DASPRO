<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Masuk | DASPRO</title>
<style>
:root{--bg:#F5F6FA;--ink:#161A2E;--mute:#6B7186;--line:#E8EAF2;--brand:#4338CA;--b2:#6366F1;--soft:#EEF0FF;--bad:#C62828}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;
 background:linear-gradient(160deg,color-mix(in srgb,var(--brand) 55%,#000) 0%,var(--brand) 55%,var(--b2) 100%) fixed;overflow-x:hidden}
a{color:inherit;text-decoration:none}h1,h2,p{margin:0}
.hide{display:none!important}.mute{color:var(--mute)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.demo{position:relative;z-index:5;background:#FFF8E1;color:#7A5B00;font-size:.8rem;text-align:center;padding:7px 12px;font-weight:600}

/* latar bergerak */
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bg span{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:float 14s ease-in-out infinite}
.bg .x1{width:340px;height:340px;background:var(--b2);top:-80px;left:-80px}
.bg .x2{width:300px;height:300px;background:#fff;opacity:.16;bottom:60px;right:-90px;animation-delay:-5s}
.bg .x3{width:240px;height:240px;background:color-mix(in srgb,var(--b2) 60%,#fff);top:40%;left:55%;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.12)}}

/* tata letak: sama di desktop dan HP */
.page{position:relative;z-index:1;width:100%;max-width:440px;margin:0 auto;padding:36px 20px 96px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;color:#fff;letter-spacing:-.01em}
.logo i{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;font-style:normal;overflow:hidden;border:1px solid rgba(255,255,255,.3)}
.hl{margin-top:26px;color:#fff;font-size:clamp(1.9rem,7.5vw,2.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.12;min-height:2.3em}
.cur{display:inline-block;width:3px;height:.9em;background:#fff;margin-left:4px;vertical-align:-.1em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lead{color:rgba(255,255,255,.8);margin:8px 0 22px;font-size:.98rem}

.card{width:100%;background:#fff;border-radius:26px;padding:28px 26px;text-align:left;box-shadow:0 30px 70px rgba(10,10,50,.35)}
.card h1{font-size:1.45rem;font-weight:800;letter-spacing:-.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);padding:4px;border-radius:13px;margin:20px 0 2px}
.seg button{border:0;background:none;font:inherit;font-weight:700;font-size:.9rem;padding:10px;border-radius:10px;cursor:pointer;color:var(--mute);transition:.15s}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 5px rgba(0,0,0,.12)}
label{display:block;font-size:.8rem;font-weight:700;color:var(--mute);margin:16px 0 6px}
input{width:100%;font:inherit;font-size:.95rem;padding:12px 15px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:none;transition:.15s}
input:focus{border-color:var(--b2);box-shadow:0 0 0 4px color-mix(in srgb,var(--b2) 20%,transparent)}
.btn{width:100%;margin-top:20px;display:inline-flex;align-items:center;justify-content:center;border:0;background:linear-gradient(120deg,var(--brand),var(--b2));color:#fff;font:inherit;font-weight:700;font-size:.95rem;padding:13px 20px;border-radius:13px;cursor:pointer;transition:.15s;box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 40%,transparent)}
.btn:hover{filter:brightness(.93);transform:translateY(-1px)}.btn:disabled{opacity:.55;transform:none}
.err{color:var(--bad);font-size:.85rem;margin-top:12px}

.chips2{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.chips2 span{display:inline-flex;align-items:center;gap:7px;color:#fff;font-size:.8rem;font-weight:600;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}

/* teks berjalan */
.ticker{position:fixed;left:0;right:0;bottom:0;z-index:4;background:rgba(10,12,40,.55);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.15);overflow:hidden;padding:12px 0}
.track{display:flex;width:max-content;animation:run 38s linear infinite}
.track span{white-space:nowrap;color:#fff;font-weight:600;font-size:.85rem;padding-right:8px}
@keyframes run{to{transform:translateX(-50%)}}
.ticker:hover .track{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.track,.bg span,.cur{animation:none}}
@media(min-width:900px){.page{max-width:480px}.card{padding:32px 30px}}
</style><link rel="stylesheet" href="css/theme.css"></head>
<body>
<div class="bg"><span class="x1"></span><span class="x2"></span><span class="x3"></span></div>

<!-- Penampil galat: jika skrip gagal dimuat, pesannya tampil merah di atas halaman -->
<script>
(function(){
  function show(msg){
    var d=document.getElementById("diag");
    if(!d){d=document.createElement("div");d.id="diag";d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:99;background:#C62828;color:#fff;padding:10px 14px;font:600 13px/1.4 system-ui,sans-serif;word-break:break-word";document.body.appendChild(d);}
    d.textContent="Gagal memuat halaman: "+msg+"  (kirim tulisan ini ke Claude)";
  }
  window.addEventListener("error",function(e){var t=e.target;show(t&&t.src?"file tidak bisa dimuat "+t.src:(e.message||"kesalahan skrip")+(e.filename?" @ "+e.filename.split("/").slice(-2).join("/")+":"+e.lineno:""));},true);
  window.addEventListener("unhandledrejection",function(e){show(String((e.reason&&e.reason.message)||e.reason));});
})();
</script>
<main class="page">
  <a href="index.html" class="logo"><i>D</i>DASPRO</a>
  <h2 class="hl">Belajar <span id="tw"></span><span class="cur"></span></h2>
  <p class="lead">Satu tempat untuk modul, tugas, dan nilai.</p>

  <section class="card">
    <h1 id="judul">Selamat datang</h1><p class="mute" id="sub">Masuk untuk melanjutkan belajar.</p>
    <div class="seg"><button id="tMasuk" class="on" type="button">Masuk</button><button id="tDaftar" type="button">Daftar siswa</button></div>
    <form id="form">
      <div id="namaWrap" class="hide"><label>Nama lengkap</label><input id="nama" placeholder="Nama Anda" autocomplete="name"></div>
      <label>Email</label><input id="email" type="email" placeholder="nama@email.com" autocomplete="email" required>
      <label>Kata sandi</label><input id="pass" type="password" minlength="6" placeholder="Minimal 6 karakter" autocomplete="current-password" required>
      <div id="kodeWrap" class="hide"><label id="kodeLbl">Kode kelas</label><input id="kode" placeholder="Contoh: K7M3QX9P" autocomplete="off" autocapitalize="characters" maxlength="24" style="text-transform:uppercase"><p class="mute" id="kodeNote" style="font-size:.82rem;margin-top:6px"></p></div>
      <a href="#" id="lupa" class="lupa">Lupa kata sandi?</a>
      <p class="err" id="err"></p>
      <button class="btn" id="kirim">Masuk</button>
    </form>
    <style>.lupa{display:block;text-align:right;font-size:.84rem;font-weight:700;color:var(--brand);margin-top:10px}.lupa:hover{text-decoration:underline}.okmsg{color:#15803D;font-size:.88rem;margin-top:12px;line-height:1.5}</style>
    <form id="formLupa" class="hide">
      <label>Email akun Anda</label><input id="emailLupa" type="email" placeholder="nama@email.com" autocomplete="email" required>
      <p class="err" id="errLupa"></p><p class="okmsg" id="okLupa"></p>
      <button class="btn" id="kirimLupa">Kirim tautan reset</button>
      <a href="#" id="kembali" class="lupa" style="text-align:center">&larr; Kembali ke halaman masuk</a>
    </form>
  </section>

  <div class="chips2"><span><span data-ic="book"></span>Materi &amp; modul</span><span><span data-ic="task"></span>Tugas</span><span><span data-ic="star"></span>Nilai</span></div>
</main>

<div class="ticker"><div class="track" id="track"></div></div>

<!-- Animasi (skrip biasa, tetap jalan walau Firebase belum terhubung) -->
<script>
(function () {
  var words = ["tertata.", "kapan saja.", "lebih mudah.", "bersama guru."], w = 0, c = 0, del = false, el = document.getElementById("tw");
  function tick() {
    var cur = words[w];
    el.textContent = cur.slice(0, c);
    if (!del && c === cur.length) { del = true; return setTimeout(tick, 1500); }
    if (del && c === 0) { del = false; w = (w + 1) % words.length; return setTimeout(tick, 350); }
    c += del ? -1 : 1;
    setTimeout(tick, del ? 45 : 85);
  }
  tick();
  var t = "\u2726 Selamat datang di DASPRO  \u2022  Daus Academic & Skills Platform  \u2022  Materi & modul selalu tersedia  \u2022  Kumpulkan tugas tanpa ribet  \u2022  Nilai dan umpan balik langsung terlihat  \u2022  ";
  document.getElementById("track").innerHTML = new Array(4 + 1).join("<span>" + t.replace(/&/g, "&amp;") + t.replace(/&/g, "&amp;") + "</span>");
})();
</script>

<script type="module">
import { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, doc, getDoc, setDoc, serverTimestamp } from "./js/firebase.js";
import { $ } from "./js/common.js";
import { kirimReset, pesanReset } from "./js/reset.js";
let daftar = false;
function mode(d) {
  daftar = d;
  $("#tMasuk").classList.toggle("on", !d); $("#tDaftar").classList.toggle("on", d);
  $("#kirim").textContent = d ? "Buat akun" : "Masuk";
  $("#sub").textContent = d ? "Daftar sebagai siswa untuk mulai belajar." : "Masuk untuk melanjutkan belajar.";
  $("#namaWrap").classList.toggle("hide", !d); $("#nama").required = d;
  $("#pass").autocomplete = d ? "new-password" : "current-password";
  $("#lupa").classList.toggle("hide", d);
  pasangKode();
}
// Mode pendaftaran dari guru (settings/pendaftaran): terbuka | kode | persetujuan
let modeDaftar = "terbuka";
async function pasangKode() {
  try { const m = await getDoc(doc(db, "settings", "pendaftaran")); modeDaftar = (m.exists() && m.data().mode) || "terbuka"; } catch { modeDaftar = "terbuka"; }
  $("#kodeWrap").classList.toggle("hide", !(daftar && modeDaftar !== "terbuka"));
  $("#kode").required = daftar && modeDaftar === "kode";
  $("#kodeLbl").textContent = modeDaftar === "kode" ? "Kode kelas" : "Kode kelas (opsional)";
  $("#kodeNote").textContent = modeDaftar === "kode" ? "Minta kode kelas kepada guru Anda." : modeDaftar === "persetujuan" ? "Tanpa kode kelas, akun Anda perlu disetujui guru terlebih dahulu." : "";
}
function lupaMode(on) {
  $("#form").classList.toggle("hide", on); $("#formLupa").classList.toggle("hide", !on); document.querySelector(".seg").classList.toggle("hide", on);
  $("#judul").textContent = on ? "Lupa kata sandi?" : "Selamat datang";
  if (on) { $("#sub").textContent = "Kami kirim tautan verifikasi ke email Anda untuk membuat kata sandi baru."; $("#emailLupa").value = $("#email").value; $("#errLupa").textContent = ""; $("#okLupa").textContent = ""; }
  else mode(false);
}
$("#lupa").onclick = (e) => { e.preventDefault(); lupaMode(true); };
$("#kembali").onclick = (e) => { e.preventDefault(); lupaMode(false); };
$("#formLupa").onsubmit = async (e) => {
  e.preventDefault(); const b = $("#kirimLupa"); $("#errLupa").textContent = ""; $("#okLupa").textContent = ""; b.disabled = true;
  try {
    await kirimReset($("#emailLupa").value.trim());
    $("#okLupa").textContent = "Jika email terdaftar, tautan reset sudah dikirim. Cek kotak masuk dan folder spam, lalu ikuti langkah di email.";
    setTimeout(() => (b.disabled = false), 30000);
  } catch (er) { $("#errLupa").textContent = pesanReset(er); b.disabled = false; }
};
$("#tMasuk").onclick = () => mode(false); $("#tDaftar").onclick = () => mode(true);
if (location.hash === "#daftar") mode(true);
$("#form").onsubmit = async (e) => {
  e.preventDefault(); $("#err").textContent = ""; $("#kirim").disabled = true;
  try {
    if (daftar) {
      await pasangKode(); // pakai mode terbaru
      let status = "aktif", extra = {};
      const kode = $("#kode").value.trim().toUpperCase();
      if (modeDaftar !== "terbuka") {
        if (kode) {
          if (!/^[A-Z0-9-]{4,24}$/.test(kode)) throw { code: "kode-salah" };
          const k = await getDoc(doc(db, "kodeKelas", kode));
          if (!k.exists() || !k.data().aktif) throw { code: "kode-salah" };
          extra = { kode, kelasId: k.data().kelasId };
        } else if (modeDaftar === "kode") throw { code: "kode-kosong" };
        else status = "menunggu";
      }
      const c = await createUserWithEmailAndPassword(auth, $("#email").value, $("#pass").value);
      try { await setDoc(doc(db, "users", c.user.uid), { nama: $("#nama").value, email: $("#email").value, role: "siswa", status, ...extra, createdAt: serverTimestamp() }); }
      catch (er) { try { await c.user.delete?.(); } catch {} throw er; } // jangan tinggalkan akun setengah jadi
      location.href = "dashboard.html";
    } else {
      const c = await signInWithEmailAndPassword(auth, $("#email").value, $("#pass").value);
      const p = (await getDoc(doc(db, "users", c.user.uid))).data();
      location.href = p?.role === "admin" ? "admin.html" : "dashboard.html";
    }
  } catch (er) {
    const m = { "auth/email-already-in-use": "Email sudah terdaftar. Silakan masuk.", "auth/weak-password": "Kata sandi minimal 6 karakter.", "auth/invalid-credential": "Email atau kata sandi salah.", "kode-salah": "Kode kelas tidak valid atau sudah dinonaktifkan.", "kode-kosong": "Kode kelas wajib diisi.", "permission-denied": "Pendaftaran ditolak. Mode pendaftaran mungkin baru berubah; muat ulang halaman lalu coba lagi." };
    $("#err").textContent = m[er.code] || "Terjadi kesalahan. Periksa konfigurasi Firebase.";
    $("#kirim").disabled = false;
  }
};
</script>
</body></html>
